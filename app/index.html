<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><meta name="theme-color" content="#f5f3ed"/><meta name="description" content="一间温室，一杯咖啡，一小段慢下来的时光。可旋转、可步入的 3D 微缩咖啡馆。"/><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 40 40%22%3E%3Cpath fill=%22%23f5f3ed%22 d=%22M0 0h40v40H0z%22/%3E%3Cpath fill=%22none%22 stroke=%22%23556749%22 stroke-width=%222%22 d=%22M6 34V15L20 4l14 11v19H6m0-19h28M20 4v30M6 25h28%22/%3E%3C/svg%3E"/><link rel="preload" as="image" href="./src/assets/portraits/ahe-thumb.webp"/><link rel="preload" as="image" href="./src/assets/portraits/lin-thumb.webp"/><link rel="preload" as="image" href="./src/assets/portraits/tang-thumb.webp"/><title>天空岛 · SKYE ISLAND</title></head><body>
<main id="app">

  <div class="scene-nav" role="group" aria-label="切换场景"><button id="outside" class="active" aria-pressed="true"><span>01</span> 庭院</button><i></i><button id="inside" aria-pressed="false"><span>02</span> 店内</button></div>
  <aside class="scene-caption"><div class="chapter">MINIATURE No. 001</div><h2 id="scene-title">把时光，留在天空岛。</h2><p id="scene-copy">一座会呼吸的温室咖啡馆</p><button id="enter" class="enter">推门，喝杯咖啡 <span>↗</span></button><div class="live-status"><span></span><b id="activity">咖啡师正在准备手冲</b></div></aside>

  <dialog id="guide"><button id="close-guide" aria-label="关闭">×</button><span class="chapter">MAKE YOURSELF AT HOME</span><h2>这里，慢一点也没关系。</h2><section class="current-operation"><strong id="guide-current-title"></strong><p id="guide-current-copy"></p><p id="guide-current-controls"></p></section><p>人物头像是相遇手记；想听故事，点选场景里的朋友。随时打开菜单，或慢慢看风景。</p><div class="guide-keys"><span><kbd>1</kbd> 全岛概览</span><span><kbd>2</kbd> 漫游</span><span><kbd>R</kbd> 漫游平视</span><span><kbd>Esc</kbd> 释放鼠标／起身</span></div><p class="guide-note">场景和人物均为实时 3D。环境声默认关闭。</p></dialog>
